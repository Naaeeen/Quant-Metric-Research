[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-metric-research"
dynamic = ["version"]
description = "Leakage-aware point-in-time metric research for cross-sectional equity signals."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.2,<3",
  "pandas>=2.3,<4",
  "pyarrow>=23.0.1,<24",
  "scikit-learn>=1.9,<2",
  "scipy>=1.15,<2",
]

[project.optional-dependencies]
notebook = [
  "nbformat>=5.11,<6",
  "nbclient>=0.10,<1",
  "ipykernel>=6,<8",
]
dev = [
  "nbformat>=5.11,<6",
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
qmr = "quant_metric_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "quant_metric_research._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=quant_metric_research",
  "--cov-report=term-missing",
  "--cov-fail-under=80",
]

[tool.coverage.run]
branch = true
source = ["quant_metric_research"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Preserve the supplied companion notebook as a byte-identical research record.
# Other lint rules still apply; this does not enable its use in the core pipeline.
"research/companion-metric-snapshot/stock_alpha_research_pipeline copy.ipynb" = ["I001", "F401"]
